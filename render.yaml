services:
  # ─── Backend Service (ASP.NET Core) ─────────────────────────────────────────
  - type: web
    name: genz-academy-api
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free # or starter
    region: frankfurt # change as needed
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Sentry__Dsn
        value: https://67ea5ad415be8071ce91508ee72b8518@o4509983381323776.ingest.de.sentry.io/4511398461309008
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: genz-academy-db
          property: connectionString

  # ─── Frontend Service (Next.js) ───────────────────────────────────────────
  - type: web
    name: genz-academy-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: https://67ea5ad415be8071ce91508ee72b8518@o4509983381323776.ingest.de.sentry.io/4511398461309008
      - key: VITE_API_BASE_URL # Using VITE prefix as per existing .env, but Next.js usually uses NEXT_PUBLIC
        value: https://genz-academy-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://genz-academy-api.onrender.com

databases:
  - name: genz-academy-db
    databaseName: academy
    user: academy_user
    plan: free
    region: frankfurt
