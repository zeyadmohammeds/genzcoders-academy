services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genzcoders-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=GenZCoders;User Id=sa;Password=Your_password123;TrustServerCertificate=True
      - Authentication__Google__ClientId=
      - Authentication__Google__ClientSecret=
      - Zoom__AccountId=
      - Zoom__ClientId=
      - Zoom__ClientSecret=
      - Zoom__MeetingSdkClientId=
      - Zoom__MeetingSdkClientSecret=
      - Email__Password=
      - Email__FromAddress=
      - Resend__ApiKey=
      - Twilio__AccountSid=
      - Twilio__AuthToken=
      - Twilio__FromNumber=
      - Paymob__ApiKey=
      - Paymob__IntegrationId=
      - Paymob__IframeId=
      - Paymob__HmacSecret=
      - Fawry__MerchantCode=
      - Fawry__SecurityKey=
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=https://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: genzcoders-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
